<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mitosis Explainer</title>
<style>
  @font-face { font-family: Nunito; font-weight: 700; src: url(fonts/nunito-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: Nunito; font-weight: 800; src: url(fonts/nunito-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: Nunito; font-weight: 900; src: url(fonts/nunito-latin-900-normal.woff2) format("woff2"); }
  :root { --bg: #050b1c; --fg: #e8eeff; --muted: #8fa3d6; --accent: #ffd23f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Nunito, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { display: block; width: min(100vw, 177.78vh - 120px); aspect-ratio: 16 / 9; background: #081230; }
  #ui { display: flex; gap: 12px; align-items: center; width: min(100vw - 32px, 177.78vh - 152px); padding: 12px 0; }
  #ui button { font: 800 16px Nunito, sans-serif; background: var(--accent); color: #1a1530; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; }
  #ui input[type=range] { flex: 1; accent-color: var(--accent); }
  #ui label, #time { font-weight: 700; color: var(--muted); font-size: 14px; white-space: nowrap; }
  #cap { min-height: 2.6em; max-width: min(100vw - 32px, 1100px); text-align: center; font-weight: 700; font-size: 18px; line-height: 1.3; }
  body.render #ui, body.render #cap { display: none; }
  body.render canvas { width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui">
  <button id="play">Play</button>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="time">0:00</span>
  <label><input id="capt" type="checkbox" checked> Captions</label>
</div>
<div id="cap"></div>
<audio id="audio" src="soundtrack.m4a" preload="auto"></audio>
<script src="timeline.js"></script>
<script src="engine.js"></script>
<script>
"use strict";

// ---------------------------------------------------------------- boot: render mode (for video export) or preview player
window.renderAt = renderAt;
window.DURATION = TL.duration;
const RENDER = location.search.includes("render");
if (RENDER) document.body.classList.add("render");
Promise.all(["700", "800", "900"].map(w => document.fonts.load(`${w} 40px Nunito`))).then(() => document.fonts.ready).then(() => {
  window.READY = true;
  if (!RENDER) preview();
});
function preview() {
  const audio = document.getElementById("audio"), play = document.getElementById("play"), seek = document.getElementById("seek");
  const timeEl = document.getElementById("time"), cap = document.getElementById("cap"), capt = document.getElementById("capt");
  const lines = TL.scenes.flatMap(s => s.lines);
  let hasAudio = false, playing = false, clock = 0, last = performance.now();
  audio.addEventListener("canplay", () => { hasAudio = true; });
  const now = () => (hasAudio ? audio.currentTime : clock);
  play.onclick = () => {
    playing = !playing; play.textContent = playing ? "Pause" : "Play";
    if (hasAudio) playing ? audio.play() : audio.pause();
  };
  seek.oninput = () => { const T = (seek.value / 1000) * TL.duration; clock = T; if (hasAudio) audio.currentTime = T; };
  const mmss = T => `${Math.floor(T / 60)}:${String(Math.floor(T % 60)).padStart(2, "0")}`;
  (function loop(ts) {
    const dt = (ts - last) / 1000; last = ts;
    if (playing && !hasAudio) clock = Math.min(TL.duration, clock + dt);
    const T = now();
    renderAt(T);
    if (document.activeElement !== seek) seek.value = (T / TL.duration) * 1000;
    timeEl.textContent = `${mmss(T)} / ${mmss(TL.duration)}`;
    const l = lines.find(l => T >= l.start - 0.1 && T <= l.end + 0.3);
    cap.textContent = capt.checked && l ? l.text : "";
    requestAnimationFrame(loop);
  })(performance.now());
}
</script>
</body>
</html>
